name: Validate plugin
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:prepare
      - run: npm run debug:build
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-touchline
          path: |
            dist/dsh-plugin-touchline-*.tgz
            dist/touchline-source-*.tar.gz
            dist/source-manifest-*.json
            dist/SHA256SUMS-*.txt
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:plugin
      - run: npm run check:live
