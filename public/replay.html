<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touchline · 追踪回放</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070c0a;
        --line: rgba(201, 242, 107, 0.16);
        --text: #e6eddd;
        --muted: #8fa084;
        --accent: #c9f26b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 500 13px/1.5 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        overflow: hidden;
      }
      #pitch { position: fixed; inset: 0; display: block; }
      .bar {
        position: fixed;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(9, 14, 11, 0.86);
        backdrop-filter: blur(12px);
        z-index: 2;
      }
      .bar--top { top: 14px; }
      .bar--bottom { bottom: 14px; }
      #title { font-weight: 700; letter-spacing: 0.01em; }
      #source { color: var(--muted); font-size: 12px; }
      #status { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
      select {
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(7, 12, 9, 0.9);
        color: var(--text);
        font: inherit;
      }
      button {
        height: 30px;
        min-width: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: rgba(201, 242, 107, 0.5); }
      #play { color: var(--accent); }
      .speeds { display: flex; gap: 4px; }
      .speeds button[aria-pressed='true'] {
        border-color: rgba(201, 242, 107, 0.55);
        color: var(--accent);
        background: rgba(201, 242, 107, 0.1);
      }
      #seek { flex: 1; accent-color: var(--accent); }
      #clock {
        min-width: 58px;
        text-align: right;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      @media (max-width: 720px) {
        #source { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="pitch"></canvas>

    <div class="bar bar--top">
      <span id="title">Touchline · 追踪回放</span>
      <span id="source"></span>
      <select id="pick" aria-label="选择回放"></select>
      <span id="status"></span>
    </div>

    <div class="bar bar--bottom">
      <button id="play" type="button" aria-label="播放 / 暂停">▶</button>
      <div class="speeds" role="group" aria-label="播放速度">
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="4">4×</button>
      </div>
      <input id="seek" type="range" min="0" max="1" value="0" step="1" aria-label="进度" />
      <span id="clock">0:00</span>
    </div>

    <script src="/replay/replay.js"></script>
  </body>
</html>
